# Render blueprint. Create the service from this file with
# Render Dashboard -> New -> Blueprint, pointed at this repository.
#
# A Static Site: `next build` exports plain files into out/ (output: "export"
# in next.config.ts), which Render serves from its CDN. There is no server to
# spin down, so visitors never see a wake-up screen.
services:
  - type: web
    name: hasanmavlonov-site
    runtime: static
    # Dev dependencies are required to build (TypeScript, Tailwind, shadcn's
    # stylesheet), so NODE_ENV is deliberately left unset here - setting it to
    # production would make npm skip them.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./out
    autoDeploy: true
    # Files without an extension, or with one a CDN may not map, get an
    # explicit type. The paths are written by `npm run build`.
    headers:
      - path: /blog/rss
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /rss
        name: Content-Type
        value: application/xml; charset=utf-8
      - path: /vcard
        name: Content-Type
        value: text/x-vcard; charset=utf-8
      - path: /vcard
        name: Content-Disposition
        value: attachment; filename=hasanmavlonov-vcard.vcf
      - path: /*.md
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: /doc.md/*
        name: Content-Type
        value: text/markdown; charset=utf-8
      - path: /llms.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # /llms-full.txt was folded into /llms.txt plus the per-section .md files.
      - type: redirect
        source: /llms-full.txt
        destination: /llms.txt
    envVars:
      # Keep in sync with .nvmrc.
      - key: NODE_VERSION
        value: 24.16.0
      # Inlined at build time, and used for canonical URLs, sitemap.xml,
      # llms.txt and Open Graph image URLs.
      - key: NEXT_PUBLIC_APP_URL
        value: https://hasanmavlonov.com
      # Read at build time only. /insights is a snapshot taken on each deploy;
      # without these three it shows its empty state.
      - key: OPENPANEL_PROJECT_ID
        sync: false
      - key: OPENPANEL_CLIENT_ID
        sync: false
      - key: OPENPANEL_CLIENT_SECRET
        sync: false
