version: 2
updates:
  # Keep GitHub Actions (the `uses:` in .github/workflows) up to date. Dependabot
  # bumps the pinned commit SHA and the `# vX.Y.Z` comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "hasan-mavlonov"
    groups:
      # Collapse all action bumps into a single PR to reduce noise.
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
