name: CI

on:
  # Gate for merging into main (required by branch protection); runs against the
  # merge result before merge.
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --include=dev is explicit so the build dependencies (TypeScript,
      # Tailwind, shadcn's stylesheet) are installed even if NODE_ENV is
      # production in the runner environment.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:run

      # Persist Next.js's build cache (.next/cache) between runs to avoid the
      # "No Cache Detected" warning and speed up rebuilds. The npm cache is
      # already handled by `cache: npm` on setup-node, so only .next/cache is
      # cached here. Key busts on lockfile or source changes; restore-keys falls
      # back to the latest cache for the same lockfile when only source changed.
      # hashFiles has no brace expansion, so extensions are listed explicitly.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Build MUST run before Typecheck: `tsc --noEmit` depends on the
      # `PageProps` global that Next.js generates into `.next/types/**` during
      # `next build`. On a fresh checkout (no `.next/`), `npm run check-types`
      # fails with "Cannot find name 'PageProps'" until a build has generated
      # those types.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run check-types
